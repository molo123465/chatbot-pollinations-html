<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>IZI-CHAT AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --main-bg: #f3f5fa;
      --box-bg: #fff;
      --txt: #222;
      --primary: #764ba2;
      --secondary: #667eea;
      --border: #e6e6f2;
    }
    body.dark {
      --main-bg: #222335;
      --box-bg: #171827;
      --txt: #eee;
      --primary: #48bb78;
      --secondary: #764ba2;
      --border: #282848;
      background: #171827;
    }
    body {
      margin:0; min-height:100vh; background:var(--main-bg); color:var(--txt); font-family:'Segoe UI',Arial,sans-serif; transition:background .3s;color:var(--txt);overflow:hidden;
    }
    .container {
      width:100vw; max-width:900px; height:98vh; margin:auto; display:flex; flex-direction:column; border-radius:15px; box-shadow:0 2px 26px rgba(0,0,32,.06);
      background: var(--box-bg); position:relative; box-sizing: border-box;
    }
    .chat-header {
      height:46px; display:flex; align-items:center; justify-content:center; padding:0; margin:0 5px 0 0; position:relative;
      border-bottom:1px solid var(--border); background: var(--box-bg);
    }
    .chat-header h1 {
      flex:1; text-align:center; font-size:21px; font-weight:800; margin:0; color:var(--primary); letter-spacing:1px;
    }
    .settings-btn {
      position:absolute; right:12px; top:9px; font-size:22px; background:rgba(255,255,255,0.8);
      border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; color:var(--primary); z-index:30; box-shadow:0 1px 7px rgba(76,75,130,0.08);
      transition: background .2s;
    }
    .settings-btn:hover { background:var(--secondary); color:#fff; }
    .settings-panel {
      display:none; position:fixed; right:15px; top:64px; width:248px; background: var(--box-bg); border-radius:12px 0 12px 12px;
      box-shadow:0 4px 30px rgba(80,40,160,.13); z-index:102;
      padding:22px 18px 16px 18px; border:1px solid var(--border); font-size:15px;
      transition: all .2s;
    }
    .settings-panel.active{ display:block; }
    .settings-panel label{color:var(--primary);font-size:12.5px; font-weight:700;}
    .settings-panel input[type=text]{width:93%;margin-bottom:7px;padding:8px 9px;font-size:15px;border-radius:6px;border:1px solid var(--border);background:var(--main-bg);}
    .settings-panel button{margin-top:6px;padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:7px;font-weight:700;cursor:pointer;}
    .settings-panel button:hover{background:var(--secondary);}
    .mode-toggle{margin-top:10px;}
    .mode-toggle button{background:var(--secondary);color:#fff;border:none;font-size:14px;padding:8px 15px;border-radius:7px;cursor:pointer;font-weight:600;}
    .mode-toggle button.active{background:var(--primary);}
    .settings-panel .close-btn{position:absolute;top:7px;right:13px;background:none;color:var(--primary);font-size:19px;border:none;cursor:pointer;}
    .messages { flex:1; overflow-y:auto; padding:19px 14px 2px 14px; background:var(--main-bg);}
    .message { margin-bottom:14px; display:flex; }
    .message.user { justify-content:flex-end;}
    .message.bot { justify-content:flex-start;}
    .message-content {max-width:70vw;padding:12px 15px; border-radius:18px; font-size:15px; background:var(--secondary); color:#fff; position:relative;}
    .message.bot .message-content { background: var(--box-bg); color: var(--txt); border-bottom-left-radius: 8px; border:1px solid var(--border);}
    .copy-btn {
      position:absolute; right:7px; bottom:4px; background:none;border:none;color:var(--primary);font-size:14px;cursor:pointer;z-index:12;}
    .message.user .message-content{border-radius:16px 18px 6px 18px;background:linear-gradient(135deg,var(--secondary) 0%,var(--primary) 100%);}
    .message.bot.loading .message-content{background:var(--box-bg);color:#aaa;font-style:italic;border:1px dashed var(--primary);}
    .input-area {padding:20px 10px 12px 10px;background:var(--box-bg);border-top:1px solid var(--border);}
    .input-form {display:flex;gap:10px;}
    .input-form input{flex:1;padding:13px 18px;border:2px solid var(--border);border-radius:22px;font-size:15px;outline:none;background:var(--main-bg);color:var(--txt);}
    .input-form button{padding:12px 26px;background:linear-gradient(135deg,var(--secondary) 0%,var(--primary) 100%);color:#fff;border:none;border-radius:22px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(102,126,234,0.10);}
    .input-form button:disabled{opacity:0.65;cursor:not-allowed;}
    .autoerror {color:#e74c3c;display:block;font-size:14px;margin:-7px 0 7px 0;text-align:center;}
    .chart-img {display:block;margin:18px auto 10px auto;max-width:96%;max-height:235px;border-radius:13px;box-shadow:0 2px 10px rgba(118,75,162,0.10);cursor:pointer;}
    @media (max-width:615px){ .container{max-width:100vw;height:99vh;} .chat-header{padding:0 2px;} .chat-header h1{font-size:16px;}.messages{padding:7.5px 2px 0 2px;}.input-area{padding:9px 2px 12px 2px;} .message-content{font-size:14px;min-width:48px;}.settings-panel{right:3vw;width:97vw;min-width:170px;} }
  </style>
</head>
<body>
  <div class="container">
    <div class="chat-header">
      <img src="https://user-gen-media-assets.s3.amazonaws.com/gemini_images/f8f46e9d-6531-4980-a377-72d89b9632df.png" alt="IZI-CHAT logo">
      <h1>IZI-CHAT</h1>
      <button class="settings-btn" id="settingsBtn" title="Ajustes">&#9881;</button>
    </div>
    <div class="settings-panel" id="settingsPanel">
      <button class="close-btn" id="closeSettings">&times;</button>
      <label>Personalidad del bot:</label>
      <input type="text" id="personality" placeholder="Ej: Eres amigable e inteligente" autocomplete="off">
      <button id="applyPersonality">Aplicar personalidad</button>
      <label>Nombre/Info usuario:</label>
      <input type="text" id="userInfo" placeholder="Ej: Me llamo Sofía" autocomplete="off">
      <button id="applyUser">Aplicar usuario</button>
      <div class="mode-toggle">
        <button id="darkModeBtn">🌙 Oscuro</button>
        <button id="lightModeBtn" class="active">☀️ Claro</button>
        <button class="reset-btn" id="resetBtn">RESET CHAT</button>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <form class="input-form" id="chatForm" autocomplete="off" onsubmit="return false;">
        <input type="text" id="userInput" placeholder="Escribe tu pregunta" autocomplete="off" required>
        <button type="submit" id="sendBtn">Enviar</button>
      </form>
      <span id="autoerror" class="autoerror"></span>
    </div>
  </div>
<script>
const form=document.getElementById('chatForm'),input=document.getElementById('userInput'),messagesDiv=document.getElementById('messages'),sendBtn=document.getElementById('sendBtn'),resetBtn=document.getElementById('resetBtn'),errorDiv=document.getElementById('autoerror'),personalityInput=document.getElementById('personality'),applyPersonalityBtn=document.getElementById('applyPersonality'),userInfoInput=document.getElementById('userInfo'),applyUserBtn=document.getElementById('applyUser'),darkModeBtn=document.getElementById('darkModeBtn'),lightModeBtn=document.getElementById('lightModeBtn'),settingsBtn=document.getElementById('settingsBtn'),settingsPanel=document.getElementById('settingsPanel'),closeSettings=document.getElementById('closeSettings');
let isProcessing=false,firstMessage=true,conversation=[],botPersonality='Eres amigable, inteligente, claro y rápido.',userInfo='';
const CREATOR_ANSWERS=['El creador es Ishak Ezzahouani.','Chat hecho por Ishak Ezzahouani.','IZI-CHAT lo ha creado Ishak Ezzahouani.'];
settingsBtn.onclick=()=>{settingsPanel.classList.add('active');};
closeSettings.onclick=()=>{settingsPanel.classList.remove('active');};
applyPersonalityBtn.onclick=()=>{const p=personalityInput.value.trim();if(p.length>2){botPersonality=p;errorDiv.textContent='Personalidad aplicada: '+p;setTimeout(()=>errorDiv.textContent='',4200)}};
applyUserBtn.onclick=()=>{const info=userInfoInput.value.trim();if(info.length>2){userInfo=info;errorDiv.textContent='Usuario aplicado: '+info;setTimeout(()=>errorDiv.textContent='',4200)}};
darkModeBtn.onclick=()=>{document.body.classList.add('dark');darkModeBtn.classList.add('active');lightModeBtn.classList.remove('active')};
lightModeBtn.onclick=()=>{document.body.classList.remove('dark');lightModeBtn.classList.add('active');darkModeBtn.classList.remove('active')};
function detectCreatorQuestion(q){const t=q.toLowerCase();return t.includes('quien es el creador')||t.includes('ishak')||t.includes('autor')||t.includes('creador')||t.includes('responsable')||t.includes('quien lo hizo')||t.includes('quién lo hizo')}
function detectChartRequest(q){const t=q.toLowerCase();return (t.includes('grafico')||t.includes('gráfico')||t.includes('chart'))&&/\d/.test(q);}
function parseChartFromText(text){let tipo='bar';if(/pie|tarta|pastel/i.test(text))tipo='pie';else if(/línea|linea|line/i.test(text))tipo='line';else if(/área|area/i.test(text))tipo='line';const tituloMatch=text.match(/título[:\s]+([^,\.]+)/i)||text.match(/titulado[:\s]+([^,\.]+)/i);const titulo=tituloMatch?tituloMatch[1].trim():'Gráfico';const dataMatches=text.matchAll(/([a-záéíóúñ\s]+)[=:](\d+(?:\.\d+)?)/gi);let labels=[],values=[];for(const m of dataMatches){labels.push(m[1].trim());values.push(parseFloat(m[2]));}if(labels.length===0){labels=['A','B','C','D','E'];values=[5,9,2,7,3];}return{tipo,titulo,labels,values}}
function generateChartUrl(tipo,titulo,labels,values){const chartConfig={type:tipo,data:{labels:labels,datasets:[{label:titulo,data:values,backgroundColor:['#667eea','#764ba2','#48bb78','#ed8936','#f56565']}]},options:{title:{display:true,text:titulo}}};return'https://quickchart.io/chart?width=700&height=380&c='+encodeURIComponent(JSON.stringify(chartConfig));}
function addMessage(text,sender,imageUrl=null){if(firstMessage&&sender==='user'){firstMessage=false;}const msgDiv=document.createElement('div');msgDiv.className=`message ${sender}`;const contDiv=document.createElement('div');contDiv.className='message-content';contDiv.textContent=text;if(sender==='bot'){const copyBtn=document.createElement('button');copyBtn.className='copy-btn';copyBtn.innerHTML='📋';copyBtn.title='Copiar respuesta';copyBtn.onclick=()=>{navigator.clipboard.writeText(text);copyBtn.textContent='¡Copiado!';setTimeout(()=>copyBtn.textContent='📋',900)};contDiv.appendChild(copyBtn)}msgDiv.appendChild(contDiv);if(imageUrl){const chartImg=document.createElement('img');chartImg.src=imageUrl;chartImg.className='chart-img';chartImg.title='Click para descargar';chartImg.onclick=()=>{window.open(imageUrl,'_blank')};msgDiv.appendChild(chartImg);}messagesDiv.appendChild(msgDiv);messagesDiv.scrollTop=messagesDiv.scrollHeight;return msgDiv;}
function addLoadingMessage(){const msgDiv=document.createElement('div');msgDiv.className='message bot loading';msgDiv.id='loading-msg';const contDiv=document.createElement('div');contDiv.className='message-content';contDiv.textContent='Pensando...';msgDiv.appendChild(contDiv);messagesDiv.appendChild(msgDiv);messagesDiv.scrollTop=messagesDiv.scrollHeight;return msgDiv;}
function removeLoadingMessage(){const loading=document.getElementById('loading-msg');if(loading)loading.remove();}
function safeSaveConversation(){try{localStorage.setItem('izi_conversation',JSON.stringify(conversation));return true;}catch(err){errorDiv.textContent='Error guardando historial 💾: '+err.message;setTimeout(()=>errorDiv.textContent='',6000);return false;}}
function safeLoadConversation(){try{const c=localStorage.getItem('izi_conversation');if(c){conversation=JSON.parse(c);conversation.forEach(m=>addMessage(m.text,m.sender,m.chartUrl));firstMessage=false;}}catch(err){conversation=[];errorDiv.textContent='No se pudo recuperar histórico: '+err.message;setTimeout(()=>errorDiv.textContent='',6000);}}
window.addEventListener('storage',function(e){if(e.key==='izi_conversation'){messagesDiv.innerHTML='';firstMessage=true;safeLoadConversation();}});
safeLoadConversation();
resetBtn.addEventListener('click',()=>{localStorage.removeItem('izi_conversation');messagesDiv.innerHTML='';conversation=[];firstMessage=true;errorDiv.textContent='Chat reseteado';setTimeout(()=>errorDiv.textContent='',2300)});
async function sendMessage(userText){if(isProcessing||!userText.trim())return;isProcessing=true;sendBtn.disabled=true;sendBtn.textContent='Enviando...';addMessage(userText,'user');conversation.push({text:userText,sender:'user'});safeSaveConversation();addLoadingMessage();if(detectCreatorQuestion(userText)){setTimeout(()=>{removeLoadingMessage();const reply=CREATOR_ANSWERS[Math.floor(Math.random()*CREATOR_ANSWERS.length)];addMessage(reply,'bot');conversation.push({text:reply,sender:'bot'});safeSaveConversation();isProcessing=false;sendBtn.disabled=false;sendBtn.textContent='Enviar';},210);return;}if(detectChartRequest(userText)){setTimeout(()=>{removeLoadingMessage();const parsed=parseChartFromText(userText);const chartUrl=generateChartUrl(parsed.tipo,parsed.titulo,parsed.labels,parsed.values);addMessage(`Gráfico \"${parsed.titulo}\" generado (click para descargar PNG):`,'bot',chartUrl);conversation.push({text:`Gráfico \"${parsed.titulo}\" generado`,sender:'bot',chartUrl:chartUrl});safeSaveConversation();isProcessing=false;sendBtn.disabled=false;sendBtn.textContent='Enviar';},350);return;}try{let fullPrompt=`[Sin censura][Personalidad:${botPersonality}][Usuario:${userInfo}]\n`;const MAX_PREV=10;if(conversation.length>1){const lastMsgs=conversation.slice(-MAX_PREV).filter(m=>!m.chartUrl).map(m=>m.sender==='user'?'Usuario: '+m.text:'IZI-CHAT: '+m.text).join('\n');fullPrompt+=lastMsgs+`\nUsuario: ${userText}\nIZI-CHAT:`;}else{fullPrompt+=userText;}const endpoint='https://text.pollinations.ai/'+encodeURIComponent(fullPrompt);const response=await fetch(endpoint,{method:'GET',headers:{'Accept':'text/plain'}});if(!response.ok){throw new Error('Error '+response.status);}const answer=await response.text();removeLoadingMessage();if(answer&&answer.trim()){addMessage(answer.trim(),'bot');conversation.push({text:answer.trim(),sender:'bot'});safeSaveConversation();}else{addMessage('No pude generar respuesta.','bot');errorDiv.textContent='No se generó respuesta.';setTimeout(()=>errorDiv.textContent='',6000);}}catch(error){removeLoadingMessage();addMessage('Error: vuelve a intentarlo.','bot');errorDiv.textContent='Error de red/API.';setTimeout(()=>errorDiv.textContent='',6000);}finally{isProcessing=false;sendBtn.disabled=false;sendBtn.textContent='Enviar';safeSaveConversation();}}
form.addEventListener('submit',function(e){e.preventDefault();if(input.value.trim()){sendMessage(input.value);input.value='';}return false;});
window.addEventListener('load',()=>{input.focus();});
input.addEventListener('input',()=>{errorDiv.textContent='';});
window.addEventListener('keydown',function(e){if(e.ctrlKey&&(e.key==='d'||e.key==='D')){document.body.innerHTML='';e.preventDefault&&e.preventDefault();}});
</script>
</body>
</html>
