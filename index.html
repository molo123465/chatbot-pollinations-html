<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Pollinations.AI estilo ChatGPT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f6fa;
    }
    .chatbox {
      max-width: 400px; margin: 32px auto; background: #fff; border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1); overflow: hidden;
      display: flex; flex-direction: column; height: 600px;
    }
    .messages {
      flex: 1; padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    .message.user {
      align-self: flex-end; background: #d1e7ff; color: #0056b3; padding: 8px 14px;
      border-radius: 14px 14px 0 14px; max-width: 70%;
    }
    .message.bot {
      align-self: flex-start; background: #ececec; color: #333; padding: 8px 14px;
      border-radius: 14px 14px 14px 0; max-width: 70%;
    }
    .chat-input {
      display: flex; padding: 12px; background: #fafbfc;
      border-top: 1px solid #eee;
    }
    .chat-input input {
      flex: 1; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; padding: 8px;
      margin-right: 8px; outline: none;
    }
    .chat-input button {
      background: #007bff; color: #fff; border: none; border-radius: 6px;
      padding: 8px 16px; font-size: 16px; cursor: pointer;
      transition: background 0.2s;
    }
    .chat-input button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="chatbox">
    <div class="messages" id="chatMessages"></div>
    <form class="chat-input" id="chatForm">
      <input type="text" id="chatInput" placeholder="Escribe tu pregunta..." autocomplete="off" required>
      <button type="submit">Enviar</button>
    </form>
  </div>
  <script>
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');

    function appendMessage(text, sender) {
      const div = document.createElement('div');
      div.classList.add('message', sender);
      div.innerText = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = chatInput.value.trim();
      if (!userText) return;
      appendMessage(userText, 'user');
      chatInput.value = '';
      appendMessage('...', 'bot');

      try {
        // URL encode prompt for spaces/special characters
        const endpoint = 'https://text.pollinations.ai/' + encodeURIComponent(userText);
        const response = await fetch(endpoint, { method: 'GET' });
        const answer = await response.text();
        // Delete previous "..." bot message
        const lastBotMsg = chatMessages.querySelector('.message.bot:last-child');
        if (lastBotMsg) lastBotMsg.remove();
        appendMessage(answer, 'bot');
      } catch (error) {
        const lastBotMsg = chatMessages.querySelector('.message.bot:last-child');
        if (lastBotMsg) lastBotMsg.remove();
        appendMessage('Error: No se pudo obtener la respuesta.', 'bot');
      }
    });
  </script>
</body>
</html>
